name: Windows executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.14.2
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build EyeTracker.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name EyeTracker --paths .
          --collect-data mediapipe --exclude-module jax --exclude-module jaxlib
          eyetracker/__main__.py
      - name: Test executable
        run: |
          $app = Start-Process -FilePath ./dist/EyeTracker.exe -ArgumentList '--self-test' -PassThru
          if (-not $app.WaitForExit(120000)) {
            Stop-Process -Id $app.Id -Force
            throw 'EyeTracker.exe did not exit after its self-test.'
          }
          if ($app.ExitCode -ne 0) {
            throw "EyeTracker.exe self-test failed with exit code $($app.ExitCode)."
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME dist/EyeTracker.exe licenses/mediapipe.txt
          --verify-tag --title "Eye Tracker $env:GITHUB_REF_NAME"
          --notes "Application autonome pour Windows 64 bits. Téléchargez EyeTracker.exe et ouvrez-le."
